services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: djangodb
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django -d djangodb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # Localmente: construye el Dockerfile. En deploy-sim se usa la imagen cargada (django-app:latest).
    build: .
    image: django-app:latest
    ports:
      - "8000:8000"
    environment:
      DB_NAME: djangodb
      DB_USER: django
      DB_PASSWORD: django123
      DB_HOST: db
      DB_PORT: "5432"
      SECRET_KEY: cambia-esta-clave
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
