<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de Tareas</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; padding: 2rem 1rem; color: #1f2933; }
    main { max-width: 560px; margin: 0 auto; background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    form.nueva { display: flex; gap: .5rem; margin-bottom: 1rem; }
    form.nueva input { flex: 1; padding: .6rem; border: 1px solid #cbd2d9; border-radius: 8px; font-size: 1rem; }
    button { padding: .5rem .9rem; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font-size: .9rem; }
    button.borrar { background: #dc2626; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .6rem 0; border-bottom: 1px solid #e4e7eb; }
    li.hecha .titulo { text-decoration: line-through; color: #9aa5b1; }
    .acciones { display: flex; gap: .4rem; }
    .acciones form { margin: 0; }
    .vacio { color: #7b8794; text-align: center; padding: 1rem 0; }
    .error { color: #dc2626; font-size: .85rem; margin: 0 0 .5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Gestor de Tareas</h1>

    <form class="nueva" method="post">
      {% csrf_token %}
      {{ form.titulo }}
      <button type="submit">Agregar</button>
    </form>
    {% for error in form.titulo.errors %}<p class="error">{{ error }}</p>{% endfor %}

    <ul>
      {% for tarea in tareas %}
        <li class="{% if tarea.completada %}hecha{% endif %}">
          <span class="titulo">{{ tarea.titulo }}</span>
          <div class="acciones">
            <form method="post" action="{% url 'alternar' tarea.pk %}">
              {% csrf_token %}
              <button type="submit">{% if tarea.completada %}Reabrir{% else %}Completar{% endif %}</button>
            </form>
            <form method="post" action="{% url 'eliminar' tarea.pk %}">
              {% csrf_token %}
              <button type="submit" class="borrar">Eliminar</button>
            </form>
          </div>
        </li>
      {% empty %}
        <li class="vacio">No hay tareas todavía.</li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
